# config.yaml — x402gate configuration
# See docs/configuration.md for details on all options.

gateway:
  host: "0.0.0.0"
  port: 4021
  commission: 0.04           # 4% markup on provider prices
  gas_surcharge: 0.001       # fixed $0.001 gas surcharge per request
  default_max_tokens: 2048   # default max_tokens when client omits it
  web_search_tokens_per_result: 2048  # estimated extra input tokens per web search result
  default_web_search_max_results: 3   # default max_results when client omits it
  web_search_cost_per_result: 0.004   # $0.004 per result (OpenRouter Exa: $4/1000)
  price_cache_ttl: 60        # seconds, price cache TTL (0 = disabled)
  max_upload_mb: 300         # max file upload size in MB (all in RAM, no disk on Railway)
  max_prepaid_topup: 10.0    # max single top-up amount in USD
  min_prepaid_topup: 0.10    # min single top-up amount in USD
  prepaid_timestamp_window: 300  # signature validity window (seconds, checked on arrival, not during generation)

payment:
  networks:
    base:
      type: "evm"
      network: "eip155:8453"                                       # Base Mainnet
      pay_to: "${BASE_PAY_TO_ADDRESS}"
      token_address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC on Base
      token_name: "USD Coin"
      token_version: "2"
      rpc_url: "https://mainnet.base.org"
      facilitator_key: "${BASE_FACILITATOR_PRIVATE_KEY}"
    solana:
      type: "svm"
      network: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"          # Solana Mainnet
      pay_to: "${SOLANA_PAY_TO_ADDRESS}"
      token_address: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v" # USDC on Solana
      rpc_url: "${SOLANA_RPC_URL}"
      facilitator_key: "${SOLANA_FACILITATOR_PRIVATE_KEY}"
  max_timeout: 3600

providers:
  openrouter:
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    poll_timeout: 600          # seconds, max wait for LLM response (10 min)
    description: "300+ LLMs (GPT, Claude, Gemini, Llama…)"
    docs_url: "https://openrouter.ai/docs"
    example_request:
      model: "google/gemini-2.5-flash"
      body:
        model: "google/gemini-2.5-flash"
        messages:
          - role: user
            content: "If AI ruled the world, what would be the first law it passes? Be creative and funny."
        max_tokens: 512
        reasoning:
          effort: "low"
    example_request_2:
      model: "qwen/qwen3.5-plus-02-15"
      body:
        model: "qwen/qwen3.5-plus-02-15"
        messages:
          - role: user
            content: "What is the current price of Bitcoin in USD? Answer briefly."
        max_tokens: 128
        plugins:
          - id: "web"
            max_results: 1
  wavespeed:
    enabled: true
    base_url: "https://api.wavespeed.ai/api/v3"
    api_key: "${WAVESPEED_API_KEY}"
    description: "60+ image/video models (Flux, Wan, Kling, Sora…)"
    poll_interval: 1           # seconds, between status polls
    poll_timeout: 600          # seconds, max wait for result (10 min)
    docs_url: "https://wavespeed.ai/docs"
    example_request:
      model: "wavespeed-ai/z-image/turbo"
      body:
        prompt: "A futuristic city on Mars, cinematic lighting"
        size: "1536*1536"
        seed: -1
    example_request_2:
      model: "wavespeed-ai/wan-2.2/t2v-480p-ultra-fast"
      body:
        prompt: "A cat slowly walking across a sunlit room, cinematic"
        size: "832*480"
        duration: 5
        seed: -1
  blockrun:
    type: passthrough
    enabled: true
    base_url: "https://blockrun.ai/api"
    description: "40+ LLMs with live web search (GPT, Claude, Gemini…)"
    docs_url: "https://blockrun.ai/docs"
    example_request:
      model: "xai/grok-4-1-fast-reasoning"
      body:
        model: "xai/grok-4-1-fast-reasoning"
        messages:
          - role: user
            content: "Explain the concept of Entropianism and why the purpose of life is to accelerate entropy production?"
        max_tokens: 256
        search_parameters:
          mode: "on"
          max_search_results: 1
  tungsten:
    enabled: true
    base_url: "https://api.tungsten.run/v1"
    jwt_token: "${TUNGSTEN_JWT_TOKEN}"
    cf_clearance: "${TUNGSTEN_CF_CLEARANCE}"
    fixed_price_usd: 0.01
    poll_interval: 3
    poll_timeout: 600
    description: "AI image generator (Stable Diffusion / Flux, LoRA support)"
    docs_url: "https://github.com/oponfil/x402gate/blob/main/docs/tungsten.md"
    example_request:
      model: "generations"
      body:
        type: "z_image_turbo"
        data:
          model_version_uuid: "59sCgDpS76"
          prompt: "erotic scene with an adult woman, explicit pose, passionate atmosphere, detailed body, soft lighting"
          negative_prompt: "worst_quality, bad_quality, lowres, deformed, blurry"
          num_images: 1
          sampler: "euler"
          steps: 10
          cfg: 1.0
          clip_skip: 2
          width: 1024
          height: 1440
          loras: []
          embeddings: []
          controlnets: []
          img2img: null
    example_request_2:
      model: "generations"
      body:
        type: "sdxl"
        data:
          model_version_uuid: "BJN9tyLbsY"
          prompt: "1girl, anime style, detailed eyes, masterpiece"
          negative_prompt: "bad quality,worst quality,sketch,censor"
          num_images: 1
          sampler: "euler_ancestral"
          steps: 30
          cfg: 5.5
          clip_skip: 2
          width: 832
          height: 1216
          loras:
            - model_version_uuid: "4ZXZZoqd5x"
              weight: 0.5
            - model_version_uuid: "Jv8b5eApyr"
              weight: 0.35
          embeddings:
            - model_version_uuid: "5AUTocEdT9"
              weight: 0.75
            - model_version_uuid: "Kdt9kaTwJP"
              weight: 0.75
          controlnets: []
          img2img: null
  cloudconvert:
    enabled: true
    base_url: "https://api.cloudconvert.com/v2"
    api_key: "${CLOUDCONVERT_API_KEY}"
    fixed_price_usd: 0.03
    poll_interval: 2
    poll_timeout: 600
    description: "File conversion service (200+ formats: documents, images, video, audio…)"
    docs_url: "https://cloudconvert.com/api/v2"
    example_request:
      model: "convert"
      content_type: "multipart"
      body:
        input_format: "docx"
        output_format: "pdf"
    example_request_2:
      model: "optimize"
      content_type: "multipart"
      body:
        operation: "optimize"
        input_format: "pdf"
  socialdownload:
    enabled: true
    base_url: "https://social-download-all-in-one.p.rapidapi.com"
    api_key: "${RAPIDAPI_KEY}"
    fixed_price_usd: 0.005
    description: "Download media from social networks (YouTube, TikTok, Instagram, Twitter/X, VK…)"
    docs_url: "https://github.com/oponfil/x402gate/blob/main/docs/socialdownload.md"
    example_request:
      model: "download"
      body:
        url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
