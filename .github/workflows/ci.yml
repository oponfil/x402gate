name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.9.0

      - name: Ruff check
        run: ruff check x402gate/ tests/

      - name: Ruff format check
        run: ruff format --check x402gate/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ --ignore=tests/e2e -v
        env:
          # Dummy values for config loading (not used in unit tests)
          WAVESPEED_API_KEY: dummy
          OPENROUTER_API_KEY: dummy
          BASE_PAY_TO_ADDRESS: "0x0000000000000000000000000000000000000000"
          BASE_FACILITATOR_PRIVATE_KEY: dummy
          SOLANA_PAY_TO_ADDRESS: "11111111111111111111111111111111"
          SOLANA_FACILITATOR_PRIVATE_KEY: dummy
          SOLANA_RPC_URL: "https://api.mainnet-beta.solana.com"
