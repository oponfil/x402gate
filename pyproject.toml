[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x402gate"
version = "0.2.2"
description = "Transparent x402 payment proxy for AI services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "x402gate contributors" },
]
keywords = ["x402", "api-gateway", "ai", "payments", "usdc", "base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "x402[fastapi,evm,svm]>=0.1.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/oponfil/x402gate"
Repository = "https://github.com/oponfil/x402gate"
Documentation = "https://github.com/oponfil/x402gate/tree/main/docs"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:websockets",
]

